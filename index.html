<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Scool Management</title>

    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <!--
      Content Security Policy pour Electron + React + Vite.

      Les directives originales sont conservées.
      Les ressources externes HTTP/HTTPS sont autorisées
      notamment pour les images, médias, fonts et API.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';

        script-src
          'self'
          'unsafe-inline'
          'unsafe-eval';

        style-src
          'self'
          'unsafe-inline'
          http:
          https:;

        img-src
          'self'
          http:
          https:
          data:
          blob:;

        font-src
          'self'
          http:
          https:
          data:;

        connect-src
          'self'
          ws:
          wss:
          http://localhost:*
          https://localhost:*
          http:
          https:;

        media-src
          'self'
          http:
          https:
          data:
          blob:;

        object-src
          'none';

        base-uri
          'self';

        form-action
          'self';
      "
    />

    <!-- Métadonnées supplémentaires -->

    <meta name="theme-color" content="#000000" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <meta name="format-detection" content="telephone=no" />

    <meta name="msapplication-TileColor" content="#000000" />

    <meta name="apple-mobile-web-app-title" content="Scool Manager" />

    <meta name="application-name" content="Scool Manager" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
